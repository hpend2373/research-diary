name: Desktop smoke test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - name: Run on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python tests/smoke.py
      - name: Run on Windows and macOS
        if: runner.os != 'Linux'
        run: python tests/smoke.py
